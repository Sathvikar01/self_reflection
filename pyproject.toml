[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-reflection"
version = "0.2.0"
description = "RL-Guided Self-Reflection for LLM Reasoning"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "datasets>=2.16.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "torch>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "ratelimit>=2.2.0",
    "tenacity>=8.2.0",
    "sentence-transformers>=2.2.0",
    "optuna>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
rl-reasoning = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=45"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: Tests requiring API access",
    "slow: Slow tests"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/rl_controller/value_network.py",
    "*/rl_controller/state_embedder.py",
    "*/rl_controller/replay_buffer.py",
    "*/rl_controller/policy_learning.py",
    "*/evaluator/value_network_evaluator.py",
    "*/data/data_augmentation.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
